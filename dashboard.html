<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docs Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #ffffff; border-bottom: 1px solid #e0e0e0; margin-bottom: 20px;">
        <div style="font-weight: 600; font-size: 16px; color: #333;">
            User: {{ username }}
        </div>
        <a href="/logout" style="padding: 8px 16px; background-color: #d93025; color: white; text-decoration: none; border-radius: 4px; font-weight: 500; transition: background-color 0.2s;">
            Sign Out
        </a>
    </nav>

    <div class="main-content">
        <h3 class="section-title" style="margin: 20px 0;">Recent documents</h3>
        <div id="docGrid" class="doc-grid">
            <div class="spinner" id="loadingSpinner"></div>
        </div>
    </div>

    <div class="fab" onclick="createNewDoc()" title="Create new document">+</div>

    <script>
        const user = localStorage.getItem('currentUser');
        if (!user) {
            window.location.href = '/';
        } else {
            document.getElementById('welcomeUser').innerText = user;
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
        }
    </script>

    <script src="/dashboard-script.js"></script>
</body>
</html>
